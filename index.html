<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Student Result System</h1>
        <form id="resultForm">
            <label for="studentName">Student Name</label>
            <input type="text" id="studentName" placeholder="Enter student name">
            <h2>Enter Subject Marks</h2>
            <label for="english">English (Out of 100)</label>
            <input type="number" id="english" placeholder="Enter English marks">

            <label for="math">Mathematics (Out of 100)</label>
            <input type="number" id="math" placeholder="Enter Mathematics marks">

            <label for="computer">Computer (Out of 100)</label>
            <input type="number" id="computer" placeholder="Enter Computer marks">

            <label for="urdu">Urdu (Out of 100)</label>
            <input type="number" id="urdu" placeholder="Enter Urdu marks">

            <label for="science">Science (Out of 100)</label>
            <input type="number" id="science" placeholder="Enter Science marks">

            <label for="islamiat">Islamiat (Out of 100)</label>
            <input type="number" id="islamiat" placeholder="Enter Islamiat marks">

            <button type="submit">Calculate Result</button>
        </form>
        <p id="message"></p>
        <div id="result">
            <h2>Student Result</h2>
            <p id="showName"></p>
            <p id="showTotal"></p>
            <p id="showObtained"></p>
            <p id="showPercentage"></p>
            <p id="showGrade"></p>
            <p id="showStatus"></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
